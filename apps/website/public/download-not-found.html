<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Not Found — KnowTheMD</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#030712;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .card{max-width:480px;text-align:center;background:rgba(15,23,42,0.8);border:1px solid rgba(6,182,212,0.15);border-radius:1.5rem;padding:2.5rem 2rem}
    h1{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:.75rem}
    p{color:#94a3b8;font-size:.9rem;line-height:1.6;margin-bottom:1.5rem}
    a.btn{display:inline-block;padding:.65rem 1.5rem;border-radius:.75rem;background:rgba(6,182,212,0.15);border:1px solid rgba(6,182,212,0.4);color:#67e8f9;font-size:.85rem;font-weight:600;text-decoration:none;transition:background .2s}
    a.btn:hover{background:rgba(6,182,212,0.25)}
    .icon{font-size:3rem;margin-bottom:1rem}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Download Unavailable</h1>
    <p>
      The requested release artifact is not yet available for your platform,
      or the link may be outdated. Please visit the downloads page to find the
      correct artifact for your system.
    </p>
    <a href="/download" class="btn">View All Downloads</a>
  </div>
</body>
</html>
